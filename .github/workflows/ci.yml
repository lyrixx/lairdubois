name: Continuous Integration

"on":
    push:
        branches: ["next"]
    pull_request:
        branches: ["next"]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        steps:
            - &checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - &buildx
              name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            # The "gha" cache of BuildKit needs the runtime variables (ACTIONS_RUNTIME_TOKEN...),
            # which the steps "run" do not get otherwise
            - &runtime
              name: Expose the GitHub Actions runtime
              uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

            - &castor
              name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            # One cache per Dockerfile target. The override file is ignored by git, and loaded
            # by Castor when it exists (.castor/context.php)
            - &docker_cache
              name: Cache the Docker layers in the GitHub Actions cache
              run: |
                  cat > infrastructure/docker/docker-compose.override.yml <<'EOF'
                  services:
                      builder:
                          build:
                              cache_from: ["type=gha,scope=builder"]
                              cache_to: ["type=gha,scope=builder,mode=max,ignore-error=true"]
                      frontend:
                          build:
                              cache_from: ["type=gha,scope=frontend"]
                              cache_to: ["type=gha,scope=frontend,mode=max,ignore-error=true"]
                      worker_consumer_view:
                          build:
                              cache_from: ["type=gha,scope=worker"]
                              cache_to: ["type=gha,scope=worker,mode=max,ignore-error=true"]
                      worker_consumer_webpush_notification:
                          build:
                              cache_from: ["type=gha,scope=worker"]
                  EOF

            # The home directory of the builder (composer cache...) is .home/
            - &composer_cache
              name: Cache the Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .home/.cache/composer
                  key: composer-${{ hashFiles('composer.lock', 'tools/*/composer.lock') }}
                  restore-keys: composer-

            - &npm_cache
              name: Cache the npm packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .home/.npm
                  key: npm-${{ hashFiles('package-lock.json', 'tests/e2e/package-lock.json') }}
                  restore-keys: npm-

            - &build
              name: Build the images
              run: castor docker:build

            - &install
              name: Install the application
              run: castor app:install

            # The pages need the entrypoints and the manifest of the build (Reprise, asset())
            - &assets
              name: Build the assets
              run: castor app:assets:build

            - &up
              name: Start the infrastructure
              run: castor docker:up

            # Database and index of the test environment (context "ci"): schema, fixtures and index
            - name: Load the fixtures
              run: castor app:db:fixtures

            - name: Install the QA tooling
              id: tooling
              run: castor qa:install

            # The checks run even when one of them fails, to report all the problems at once
            - name: Lint
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              run: castor qa:lint

            - name: PHPStan
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              run: castor qa:phpstan

            - name: PHPUnit
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              run: castor qa:phpunit

            # A to-do list before each upgrade of Symfony, in the summary of the run: it never
            # fails the CI
            - name: Report the Symfony deprecations
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              continue-on-error: true
              run: castor qa:deprecations

            - name: Upload the deprecations report
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: deprecations
                  path: |
                      var/deprecations/report.md
                      var/deprecations/php.md
                  if-no-files-found: ignore

    # The end-to-end tests (tests/e2e) beside the QA: same setup (YAML anchors of the job "ci"),
    # then castor qa:e2e resets the database of the site and runs Playwright in its container
    e2e:
        name: E2E
        runs-on: ubuntu-latest
        steps:
            - *checkout
            - *buildx
            - *runtime
            - *castor
            - *docker_cache
            - *composer_cache
            - *npm_cache
            - *build
            - *install
            - *assets
            - *up

            - name: Run the end-to-end tests
              run: castor qa:e2e

            - name: Upload the traces and screenshots of the failed tests
              if: ${{ failure() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-test-results
                  path: var/e2e/test-results/
                  if-no-files-found: ignore

    # The production images (php, nginx), built and checked in their stack
    # (infrastructure/docker/docker-compose.prod.yml), never pushed from a pull request
    prod:
        name: Production images
        runs-on: ubuntu-latest
        steps:
            - *checkout
            - *buildx
            - *runtime
            - *castor
            # The builder of the dev installs vendor/ for the fixtures (castor app:install)
            - *docker_cache

            # The override of the stack of prod, loaded by its context (.castor/context.php)
            - &prod_docker_cache
              name: Cache the Docker layers of the production images in the GitHub Actions cache
              run: |
                  cat > infrastructure/docker/docker-compose.prod.override.yml <<'EOF'
                  services:
                      php:
                          build:
                              cache_from: ["type=gha,scope=prod-php"]
                              cache_to: ["type=gha,scope=prod-php,mode=max,ignore-error=true"]
                      nginx:
                          build:
                              cache_from: ["type=gha,scope=prod-nginx"]
                              cache_to: ["type=gha,scope=prod-nginx,mode=max,ignore-error=true"]
                      builder:
                          build:
                              cache_from: ["type=gha,scope=builder"]
                  EOF

            - *composer_cache
            - *npm_cache

            - name: Build the production images
              run: castor -c prod docker:build

            # The builder of the dev and vendor/, for the fixtures
            - name: Install the application
              run: |
                  castor docker:build --service=builder
                  castor app:install

            - name: Check the site in the production images
              run: castor qa:prod-smoke

            - name: Describe the images (size, content)
              if: ${{ !cancelled() }}
              run: castor -c prod app:prod:describe >> "$GITHUB_STEP_SUMMARY"

            - name: Upload the traces and screenshots of the failed tests
              if: ${{ failure() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: prod-e2e-test-results
                  path: var/e2e/test-results/
                  if-no-files-found: ignore

    # The images checked by the job "prod", pushed to the registry of the repository (GHCR) on each
    # push to next, tagged "next" and with the commit
    push:
        name: Push the production images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
        needs: [ci, e2e, prod]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            REGISTRY: "ghcr.io/${{ github.repository }}"
        steps:
            - *checkout
            - *buildx
            - *runtime
            - *castor
            - *prod_docker_cache

            - name: Log in to the registry
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            - name: Build and push the production images
              run: castor -c prod docker:push --tag=next --tag="$GITHUB_SHA"
