name: Continuous Integration

"on":
    push:
        branches: ["next"]
    pull_request:
        branches: ["next"]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci

jobs:
    ci:
        name: CI
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            # The "gha" cache of BuildKit needs the runtime variables (ACTIONS_RUNTIME_TOKEN...),
            # which the steps "run" do not get otherwise
            - name: Expose the GitHub Actions runtime
              uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            # One cache per Dockerfile target. The override file is ignored by git, and loaded
            # by Castor when it exists (.castor/context.php)
            - name: Cache the Docker layers in the GitHub Actions cache
              run: |
                  cat > infrastructure/docker/docker-compose.override.yml <<'EOF'
                  services:
                      builder:
                          build:
                              cache_from: ["type=gha,scope=builder"]
                              cache_to: ["type=gha,scope=builder,mode=max,ignore-error=true"]
                      frontend:
                          build:
                              cache_from: ["type=gha,scope=frontend"]
                              cache_to: ["type=gha,scope=frontend,mode=max,ignore-error=true"]
                      websocket:
                          build:
                              cache_from: ["type=gha,scope=worker"]
                              cache_to: ["type=gha,scope=worker,mode=max,ignore-error=true"]
                      worker_consumer_view:
                          build:
                              cache_from: ["type=gha,scope=worker"]
                      worker_consumer_webpush_notification:
                          build:
                              cache_from: ["type=gha,scope=worker"]
                  EOF

            # The home directory of the builder (composer cache...) is .home/
            - name: Cache the Composer packages
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .home/.cache/composer
                  key: composer-${{ hashFiles('composer.lock', 'tools/*/composer.lock') }}
                  restore-keys: composer-

            - name: Build the images
              run: castor docker:build

            - name: Install the application
              run: castor app:install

            - name: Start the infrastructure
              run: castor docker:up

            - name: Create the database schema
              run: castor app:db:schema

            - name: Populate Elasticsearch
              run: castor app:elasticsearch:populate

            - name: Install the QA tooling
              id: tooling
              run: castor qa:install

            # The checks run even when one of them fails, to report all the problems at once
            - name: Lint
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              run: castor qa:lint

            - name: PHPStan
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              run: castor qa:phpstan

            - name: PHPUnit
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              run: castor qa:phpunit

            # A to-do list before each upgrade of Symfony, in the summary of the run: it never
            # fails the CI
            - name: Report the Symfony deprecations
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              continue-on-error: true
              run: castor qa:deprecations

            - name: Upload the deprecations report
              if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: deprecations
                  path: var/deprecations/report.md
                  if-no-files-found: ignore
