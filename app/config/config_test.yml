imports:
    - { resource: config_dev.yml }

framework:
    test: ~
    session:
        storage_factory_id: session.storage.factory.mock_file
    # The profiler only collects on demand: $client->enableProfiler()
    profiler:
        collect: false
    # Nothing is delivered: the tests read the emails in the profiler (collector "mailer") or in
    # the container (Tests\WebTestCase)
    mailer:
        dsn: 'null://null'
    # RabbitMQ gets no messages from the tests: the workers of the dev stack would process them on
    # the dev database, and the CI does not start them. In memory (tests.view_transport,
    # tests.webpush_notification_transport), unless a test sets the variable (RabbitMqTest,
    # UnreachableRabbitMqTest). Then in exchanges and queues of their own, which the workers of the
    # dev stack do not read.
    messenger:
        transports:
            view:
                dsn: '%env(LADB_TEST_MESSENGER_TRANSPORT_DSN)%'
                options: { exchange: { name: test_view }, queues: { test_view: ~ } }
            webpush_notification:
                dsn: '%env(LADB_TEST_MESSENGER_TRANSPORT_DSN)%'
                options: { exchange: { name: test_webpush_notification }, queues: { test_webpush_notification: ~ } }

web_profiler:
    toolbar: false
    intercept_redirects: false

# The debug level of config_dev.yml writes 200 MB per run of the smoke test
monolog:
    handlers:
        main:
            level: notice

# No status posted on Mastodon by ladb:cron:spotlight, which calls its API with curl: curl knows
# no such protocol, and fails before any connection
parameters:
    mastodon_instance: 'offline://mastodon'
    env(LADB_TEST_MESSENGER_TRANSPORT_DSN): 'in-memory://'
    # Their own indexes, as their own database below
    elasticsearch_index_prefix: ladb_test_

# Their own database and indexes, loaded with the fixtures (castor -c test app:db:fixtures): the
# tests do not overwrite the data of the dev environment. Each test runs in a transaction rolled
# back at its end (dama/doctrine-test-bundle).
doctrine:
    dbal:
        dbname: "%database_name%_test"

services:
    # Public only for the doubles that the tests read from the container
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # The Mercure hub gets no updates from the tests either, as RabbitMQ (framework.messenger): they
    # are kept (getUpdates()). Decorated, not redefined: the definition of the bundle would win over
    # the one of the app
    tests.mercure_hub:
        class: Tests\Double\InMemoryHub
        decorates: mercure.hub.default
        arguments: ['@tests.mercure_hub.inner']
        public: true
    # The messages sent to RabbitMQ: getSent()
    tests.view_transport:
        alias: messenger.transport.view
        public: true
    tests.webpush_notification_transport:
        alias: messenger.transport.webpush_notification
        public: true

    # No push service: the requests of the web push notifications go to Tests\Double\InMemoryPushHandler
    tests.webpush_push_handler:
        class: Tests\Double\InMemoryPushHandler
        public: true
    tests.webpush_http_client:
        class: GuzzleHttp\Client
        decorates: ladb_core.webpush_http_client
        arguments: [{ handler: '@tests.webpush_handler_stack' }]
    tests.webpush_handler_stack:
        class: GuzzleHttp\HandlerStack
        factory: ['GuzzleHttp\HandlerStack', 'create']
        arguments: ['@tests.webpush_push_handler']

    # No call to the geocoding API of Google: addresses of Tests\Double\OfflineLocalisableUtils
    tests.localisable_utils:
        class: Tests\Double\OfflineLocalisableUtils
        decorates: ladb_core.localisable_utils
        arguments: { $googleApiKey: '%google_api_key%', $httpClient: '@ladb_core.geocoding_http_client' }

    # No outgoing request from the tests (issue #6): the pictures "downloaded" from a URL, the
    # Open Graph metas, the thumbnails and the sitemap data of the video APIs and the Chromium
    # screenshots of a find come from the fixtures. Subclasses, as some services ask for the class of the original.
    tests.open_graph_utils:
        class: Tests\Double\OfflineOpenGraphUtils
        decorates: ladb_core.open_graph_utils
        arguments: { $facebookAccessToken: '%facebook_access_token%', $facebookAppId: '%facebook_app_id%', $facebookAppSecret: '%facebook_app_secret%' }
    tests.picture_manager:
        class: Tests\Double\OfflinePictureManager
        decorates: ladb_core.core_picture_manager
        public: true
    tests.video_hosting_utils:
        class: Tests\Double\OfflineVideoHostingUtils
        decorates: ladb_core.video_hosting_utils
        arguments: { $googleApiKey: '%google_api_key%' }
    tests.web_screenshot_utils:
        class: Tests\Double\OfflineWebScreenshotUtils
        decorates: ladb_core.web_screenshot_utils
        arguments: { $chromium: '%chromium%' }

    # No call to the API of Stripe (/financement): FundingController calls its static API, which
    # gets the HTTP client of Tests\Double\OfflineStripeClient at each request
    tests.stripe_client:
        class: Tests\Double\OfflineStripeClient
        public: true
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 4096 }

    # What each search of a request found in the index: getSearches() (Tests\Search\FacetTest)
    tests.search_utils:
        class: Tests\Double\RecordingSearchUtils
        decorates: ladb_core.search_utils
        arguments: { $indexManager: '@fos_elastica.index_manager', $persisterRegistry: '@fos_elastica.persister_registry' }
        public: true

    # The factory of the fixtures, to create the pictures and resources of a new content
    tests.fixture_factory:
        alias: Ladb\CoreBundle\DataFixtures\FixtureFactory
        public: true

    # The templates that cache:warmup compiles (Tests\Twig\TemplateCacheWarmerTest)
    tests.twig_template_iterator:
        alias: twig.template_iterator
        public: true
