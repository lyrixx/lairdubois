# MercureBundle
mercure:
    # The cookie and the JWT of the subscription of a workspace (WorkflowController::showAction())
    # last as long as remember_me (security.yml): the hub closes a subscription when its JWT
    # expires, and refuses the reconnection of the browser, which sends the same cookie. Deleted
    # at logout
    default_cookie_lifetime: 31536000 # 365 days in seconds
    hubs:
        default:
            url: '%mercure_url%'
            public_url: '%mercure_public_url%'
            jwt:
                secret: '%mercure_jwt_secret%'
                publish: '*'

# BentoolsWebpushBundle
bentools_webpush:
    settings:
        public_key: '%bentools_webpush.public_key%'
        private_key: '%bentools_webpush.private_key%'
