security:
    enable_authenticator_manager: true

    password_hashers:
        # The hash of FOSUserBundle, the one of the accounts that have not logged in since #24: hashed
        # again by the native hasher at their next login (UserRepository::upgradePassword())
        fos_user_sha512:
            algorithm: sha512
            encode_as_base64: true
            iterations: 5000
        Ladb\CoreBundle\Entity\Core\User:
            # Not "auto": it ignores migrate_from (Symfony 4.4 and 5.4)
            algorithm: native
            migrate_from: [fos_user_sha512]

    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN

    providers:
        # By username or email (UserRepository::loadUserByIdentifier())
        users:
            entity:
                class: Ladb\CoreBundle\Entity\Core\User

    firewalls:
        main:
            pattern: ^/
            user_checker: ladb_core.user_checker
            form_login:
                provider: users
                enable_csrf: true
                use_referer: true
            # Redirected to the referer by AuthenticationHandler (LogoutEvent)
            logout:
                # The subscription cookie of the workspaces (Mercure, a year as remember_me)
                delete_cookies:
                    __Secure-mercure_access_token: { path: /.well-known/mercure, secure: true, samesite: strict }
            remember_me:
                secret:   "%secret%"
                lifetime: 31536000 # 365 days in seconds
                path:     /
                domain:   ~ # Defaults to the current domain from $_SERVER
            switch_user: { role: ROLE_ADMIN, parameter: _switch_to }

        dev:
            pattern:  ^/(_(profiler|wdt)|css|images|js)/
            security: false

    access_control:
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/connexion$, role: PUBLIC_ACCESS }
        - { path: ^/salut$, role: PUBLIC_ACCESS }
        - { path: ^/resetting$, role: PUBLIC_ACCESS }

        - { path: ^/media/cache/resolve/, role: PUBLIC_ACCESS }

        - { path: ^/email/check$, role: ROLE_USER }
        - { path: ^/email/confirm, role: ROLE_USER }

        - { path: ^/@me$, role: ROLE_USER }
        - { path: ^/me$, role: ROLE_USER }
        - { path: /parametres$, role: ROLE_USER }
        - { path: ^/messagerie, role: ROLE_USER }
        - { path: ^/members/, role: ROLE_USER }
        - { path: ^/notifications, role: ROLE_USER }
        - { path: ^/webpush/, role: ROLE_USER }
        - { path: /mes-dons$, role: ROLE_USER }
        - { path: /mes-tooks$, role: ROLE_USER }
        - { path: ^/collections/available/, role: ROLE_USER }

        - { path: /new$, role: ROLE_USER }
        - { path: /create$, role: ROLE_USER }
        - { path: /lock$, role: ROLE_USER }
        - { path: /unlock$, role: ROLE_USER }
        - { path: /publish$, role: ROLE_USER }
        - { path: /unpublish$, role: ROLE_USER }
        - { path: /update$, role: ROLE_USER }
        - { path: /edit$, role: ROLE_USER }
        - { path: /delete$, role: ROLE_USER }
        - { path: /chown$, role: ROLE_USER }
        - { path: /copy$, role: ROLE_USER }
        - { path: /restart$, role: ROLE_USER }
        - { path: /accept, role: ROLE_USER }
        - { path: /upload$, role: ROLE_USER }

        - { path: /internal/, role: PUBLIC_ACCESS, ips: [127.0.0.1, ::1] }
        - { path: /internal/, role: ROLE_ADMIN }

