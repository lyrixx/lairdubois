imports:
    - { resource: parameters.yml }
    - { resource: config.yml }

#doctrine:
#    orm:
#        metadata_cache_driver: apc
#        result_cache_driver: apc
#        query_cache_driver: apc

monolog:
    handlers:
        # Only the warnings and above wait for an error in the buffer of fingers_crossed: nested
        # writes nothing below them, and the buffer kept every other record until the end of a
        # command, such as the info of Messenger for each email sent (#290)
        main:
            type:      filter
            min_level: warning
            handler:   fingers_crossed
        fingers_crossed:
            type:         fingers_crossed
            action_level: error
            handler:      nested
        nested:
            type:  stream
            path:  "%kernel.logs_dir%/%kernel.environment%.log"
            level: warning
