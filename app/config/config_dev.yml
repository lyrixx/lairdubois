imports:
    - { resource: parameters.yml }
    - { resource: config.yml }
    - { resource: fixtures.yml }

framework:
    router:   { resource: "%kernel.project_dir%/app/config/routing_dev.yml" }
    # collect_serializer_data: the only value of Symfony 8.0 (no effect, the Serializer is not
    # installed). Symfony 8.1 deprecates the option
    profiler: { only_exceptions: false, collect_serializer_data: true }
    # Domain of the Docker stacks (see castor.php), the same for every git worktree
    trusted_hosts: ['^lairdubois\.test$']
    # Every email goes to this address (Mailpit in Docker): only the envelope changes, the To
    # header keeps the recipients
    mailer:
        envelope:
            recipients: ['dev@lairdubois.fr']

web_profiler:
    toolbar: true
    intercept_redirects: false

monolog:
    handlers:
        main:
            type:  stream
            path:   "%kernel.logs_dir%/%kernel.environment%.log"
            level:  debug
        console:
            type:   console
            bubble: false
            verbosity_levels:
                VERBOSITY_VERBOSE: INFO
                VERBOSITY_VERY_VERBOSE: DEBUG
            channels: ["!doctrine"]
        console_very_verbose:
            type:   console
            bubble: false
            verbosity_levels:
                VERBOSITY_VERBOSE: NOTICE
                VERBOSITY_VERY_VERBOSE: NOTICE
                VERBOSITY_DEBUG: DEBUG
            channels: ["doctrine"]
        # uncomment to get logging in your browser
        # you may have to allow bigger header sizes in your Web server configuration
        #firephp:
        #    type:   firephp
        #    level:  info
        #chromephp:
        #    type:   chromephp
        #    level:  info
