  # Handlers of the messages of Messenger (tagged messenger.message_handler by autoconfigure)
  Ladb\CoreBundle\Consumer\ViewConsumer: ~
  Ladb\CoreBundle\Consumer\WebpushNotificationConsumer: ~

  # Controllers: tagged controller.service_arguments by autoconfigure, which makes them public (the
  # resolver reads them from the container) and resolves the services of an action from its arguments
  Ladb\CoreBundle\Controller\:
    resource: '../../Controller'

  # Commands: tagged console.command by autoconfigure, loaded lazily by their #[AsCommand]
  Ladb\CoreBundle\Command\:
    resource: '../../Command'
    bind:
      $databaseHost: '%database_host%'
      $databaseName: '%database_name%'
      $databasePassword: '%database_password%'
      $databasePort: '%database_port%'
      $databaseUser: '%database_user%'
      $facebookAccessToken: '%facebook_access_token%'
      $facebookAppId: '%facebook_app_id%'
      $facebookAppSecret: '%facebook_app_secret%'
      $facebookPageId: '%facebook_page_id%'
      $mastodonAccessToken: '%mastodon_access_token%'
      $mastodonInstance: '%mastodon_instance%'
      $secret: '%secret%'
      $twitterAccessSecret: '%twitter_access_secret%'
      $twitterAccessToken: '%twitter_access_token%'
      $twitterConsumerKey: '%twitter_consumer_key%'
      $twitterConsumerSecret: '%twitter_consumer_secret%'

  # WebPush
  Ladb\CoreBundle\Manager\Webpush\UserSubscriptionManager:
    arguments: ['@doctrine']
  # The sender of bentools/webpush-bundle, with the TTL of minishlink/web-push 2.0 (4 weeks): the bundle has
  # a TTL of 0 (dropped if the browser is offline). The timeout is the one of the sender, 30 seconds per
  # request (PushMessageSender::DEFAULT_TIMEOUT), which takes precedence over the options of the client.
  # The client is a service of its own for the test environment, which gives it a handler (config_test.yml)
  BenTools\WebPushBundle\Sender\PushMessageSender:
    arguments:
      - VAPID:
          subject: '%bentools_webpush.vapid_subject%'
          publicKey: '%bentools_webpush.vapid_public_key%'
          privateKey: '%bentools_webpush.vapid_private_key%'
      - TTL: 2419200
      - '@ladb_core.webpush_http_client'
  ladb_core.webpush_http_client:
    class: GuzzleHttp\Client
