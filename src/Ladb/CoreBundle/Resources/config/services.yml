services:

  # Private: nothing reads them from the container (#118). The ids stay "ladb_core.*": an alias by class lets
  # autowiring find each service by its type.
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Twig extensions
  ladb.twig.ladb_extension:
    class: Ladb\CoreBundle\Twig\LadbExtension
    arguments: { $serviceLocator: '@ladb.twig.ladb_extension.service_locator' }
  # LadbExtension: the services that it reads when a filter or a function needs them, by their id. Twig creates it
  # at each request: TypableUtils and UserManager would create the entity manager, VideoHostingUtils needs Twig
  ladb.twig.ladb_extension.service_locator:
    class: Symfony\Component\DependencyInjection\ServiceLocator
    tags: ['container.service_locator']
    arguments:
      -
        ladb_core.core_user_manager: '@ladb_core.core_user_manager'
        ladb_core.typable_utils: '@ladb_core.typable_utils'
        ladb_core.video_hosting_utils: '@ladb_core.video_hosting_utils'

  # Error pages: TwigErrorRenderer (error_renderer.html) only renders HTML
  ladb_core.request_format_error_renderer:
    class: Ladb\CoreBundle\ErrorRenderer\RequestFormatErrorRenderer
    decorates: error_renderer
    arguments:
      $errorRenderer: '@ladb_core.request_format_error_renderer.inner'
      $debug: '@ladb_core.request_format_error_renderer.debug'
  # As for TwigErrorRenderer: false when the error controller previews a page in debug (showException)
  ladb_core.request_format_error_renderer.debug:
    class: Closure
    factory: [Symfony\Component\ErrorHandler\ErrorRenderer\HtmlErrorRenderer, isDebug]
    arguments: ['@request_stack', '%kernel.debug%']

  # Imagine Post processors
  ladb_imagine.filter.post_processor.imageoptimizer:
    class: Ladb\CoreBundle\Imagine\ImageOptimizerPostProcessor
    tags:
      - { name: liip_imagine.filter.post_processor, post_processor: ladb_imageoptimizer }

  # Security: the user checker of the firewall
  ladb_core.user_checker:
    class: Ladb\CoreBundle\Security\UserChecker
  Ladb\CoreBundle\Security\UserChecker: '@ladb_core.user_checker'
  # The listener of @Security of SensioFrameworkExtraBundle, with a NullToken for an anonymous user: the 404
  # of its statusCode, not a redirection to the login form. To remove with the bundle (#27)
  sensio_framework_extra.security.listener:
    class: Sensio\Bundle\FrameworkExtraBundle\EventListener\SecurityListener
    arguments:
      - '@framework_extra_bundle.argument_name_convertor'
      - '@sensio_framework_extra.security.expression_language.default'
      - '@security.authentication.trust_resolver'
      - '@security.role_hierarchy'
      - '@ladb_core.null_token_storage'
      - '@security.authorization_checker'
      - '@logger'
  ladb_core.null_token_storage:
    class: Ladb\CoreBundle\Security\NullTokenStorage
    arguments: ['@security.token_storage']

  # Utils
  ladb_core.displayname_canonicalizer:
    class: Ladb\CoreBundle\Utils\DisplaynameCanonicalizer
  Ladb\CoreBundle\Utils\DisplaynameCanonicalizer: '@ladb_core.displayname_canonicalizer'
  ladb_core.canonical_fields_updater:
