  # Topics
  ladb_workflow_topic:
    class: Ladb\CoreBundle\Topic\WorkflowTopic
    tags:
      - { name: gos_web_socket.topic }
    arguments: ['@service_container']

  # Gos WebSocket in PHP 8 (to remove with it, #21)
  gos_web_socket.wamp.pusher:  # Redefined: LadbCoreBundle is registered after GosWebSocketBundle, its definition wins
    parent: gos_web_socket.abstract.pusher
    class: Ladb\CoreBundle\WebSocket\WampPusher
    # A child definition does not inherit _defaults: explicit, as in its parent (public until #16)
    autowire: false
    autoconfigure: false
    public: true
    tags:
      - { name: gos_web_socket.pusher, alias: wamp }
  ladb_core.websocket.session_listener:
    class: Ladb\CoreBundle\WebSocket\SessionListener
    arguments: ['@gos_web_socket.session_handler']
    tags:
      - { name: kernel.event_listener, event: gos_web_socket.client_connected, method: onClientConnect, priority: 10 }  # Before the authentication of Gos

  # Consumer
  Ladb\CoreBundle\Consumer\ViewConsumer:
    arguments: ['@service_container']
  Ladb\CoreBundle\Consumer\WebpushNotificationConsumer: ~

  # Controllers: tagged controller.service_arguments by autoconfigure, which makes them public (the
  # resolver reads them from the container) and resolves the services of an action from its arguments
  Ladb\CoreBundle\Controller\:
    resource: '../../Controller'

  # Commands: tagged console.command by autoconfigure, loaded lazily by their $defaultName
  Ladb\CoreBundle\Command\:
    resource: '../../Command'
    bind:
      $databaseHost: '%database_host%'
      $databaseName: '%database_name%'
      $databasePassword: '%database_password%'
      $databasePort: '%database_port%'
      $databaseUser: '%database_user%'
      $facebookAccessToken: '%facebook_access_token%'
      $facebookAppId: '%facebook_app_id%'
      $facebookAppSecret: '%facebook_app_secret%'
      $facebookPageId: '%facebook_page_id%'
      $mastodonAccessToken: '%mastodon_access_token%'
      $mastodonInstance: '%mastodon_instance%'
      $secret: '%secret%'
      $twitterAccessSecret: '%twitter_access_secret%'
      $twitterAccessToken: '%twitter_access_token%'
      $twitterConsumerKey: '%twitter_consumer_key%'
      $twitterConsumerSecret: '%twitter_consumer_secret%'

  # WebPush
  Ladb\CoreBundle\Manager\Webpush\UserSubscriptionManager:
    public: true  # Read from the container by the WebpushController
    arguments: ['@doctrine']
  # The sender of bentools/webpush-bundle, with the TTL (4 weeks) and the timeout of minishlink/web-push 2.0:
  # the bundle has a TTL of 0 (dropped if the browser is offline) and a Guzzle client without timeout
  BenTools\WebPushBundle\Sender\PushMessageSender:
    arguments:
      - VAPID:
          subject: '%bentools_webpush.vapid_subject%'
          publicKey: '%bentools_webpush.vapid_public_key%'
          privateKey: '%bentools_webpush.vapid_private_key%'
      - TTL: 2419200
      - '@ladb_core.webpush_http_client'
  ladb_core.webpush_http_client:
    class: GuzzleHttp\Client
    arguments: [{ timeout: 30 }]
