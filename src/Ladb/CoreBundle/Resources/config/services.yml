  Ladb\CoreBundle\Utils\CanonicalFieldsUpdater: '@ladb_core.canonical_fields_updater'
  ladb_core.global_utils:
    class: Ladb\CoreBundle\Utils\GlobalUtils
    arguments: { $debug: '%kernel.debug%', $environment: '%kernel.environment%' }
  Ladb\CoreBundle\Utils\GlobalUtils: '@ladb_core.global_utils'
  ladb_core.maybe_utils:
    class: Ladb\CoreBundle\Utils\MaybeUtils
  Ladb\CoreBundle\Utils\MaybeUtils: '@ladb_core.maybe_utils'
  ladb_core.crypto_utils:
    class: Ladb\CoreBundle\Utils\CryptoUtils
    arguments: { $secret: '%secret%' }
  Ladb\CoreBundle\Utils\CryptoUtils: '@ladb_core.crypto_utils'
  ladb_core.paginator_utils:
