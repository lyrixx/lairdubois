# Templates to factorize the service definitions
x-templates:
    # Values of app/config/parameters.yml for this stack, read by
    # incenteev/composer-parameter-handler ("env-map" in composer.json) when
    # composer runs in the builder
    parameters_environment: &parameters_environment
        DATABASE_HOST: mariadb
        DATABASE_PASSWORD: app
        DATABASE_USER: root
        ELASTICSEARCH_HOST: elasticsearch
        # The SMTP of Mailpit (service "mailpit")
        MAILER_DSN: smtp://mailpit:1025
        MEMCACHED_HOST: memcached
        # The same key signs the JWT of the site (publisher) and of the subscribers, for the hub
        # (service "mercure")
        MERCURE_JWT_SECRET: &mercure_jwt_secret "lairdubois-dev-mercure-jwt-secret-not-secret"
        MERCURE_PUBLIC_URL: "https://${PROJECT_ROOT_DOMAIN}${PROJECT_HTTPS_PORT:+:${PROJECT_HTTPS_PORT}}/.well-known/mercure"
        MERCURE_URL: http://mercure/.well-known/mercure
        RABBITMQ_HOST: rabbitmq
        RABBITMQ_PASSWORD: app
        RABBITMQ_USER: app
        # The port of the router is part of the host in a worktree (see
        # .castor/worktree.php): the assets URLs are absolute (base_urls in config.yml)
        ROUTER_REQUEST_CONTEXT_HOST: "${PROJECT_ROOT_DOMAIN}${PROJECT_HTTPS_PORT:+:${PROJECT_HTTPS_PORT}}"
    worker_base: &worker_base
        build:
            context: services/php
            target: worker
        init: true
        user: "${USER_ID}:${USER_ID}"
        environment:
            - SYMFONY_ENV
        depends_on:
            elasticsearch:
                condition: service_healthy
            mariadb:
                condition: service_healthy
            memcached:
                condition: service_started
            rabbitmq:
                condition: service_healthy
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        profiles:
            - worker

volumes:
    # One per major version: Elasticsearch does not start on the data of an older one, the
    # indexes come from the database (castor app:elasticsearch:populate)
    elasticsearch-7-data: {}
    mariadb-data: {}
    rabbitmq-data: {}

services:
    mariadb:
        image: mariadb:10.11
        environment:
            - MARIADB_ROOT_PASSWORD=app
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 10
        profiles:
            - default

    elasticsearch:
        image: elasticsearch:7.17.28
        environment:
            # A single node: no bootstrap checks (vm.max_map_count...)
            - discovery.type=single-node
            # No TLS nor password, as on the production server, where it only listens on 127.0.0.1
            - xpack.security.enabled=false
            # No download of the GeoIP databases of the ingest pipelines, which the site does not use
            - ingest.geoip.downloader.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        volumes:
            - elasticsearch-7-data:/usr/share/elasticsearch/data
        healthcheck:
            test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
            interval: 5s
            timeout: 10s
            retries: 30
        profiles:
            - default

    rabbitmq:
        image: rabbitmq:3.13-alpine
        environment:
            - RABBITMQ_DEFAULT_USER=app
            - RABBITMQ_DEFAULT_PASS=app
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            interval: 5s
            timeout: 10s
            retries: 30
        profiles:
            - default

    memcached:
        image: memcached:1.6-alpine
        profiles:
            - default

    # The hub of Mercure, in HTTP behind the router: same domain and port as the site. No
    # anonymous subscriber, as in production: the site sets the JWT in a cookie
    mercure:
        image: dunglas/mercure:v0.24.2
        environment:
            SERVER_NAME: ":80"
            MERCURE_PUBLISHER_JWT_KEY: *mercure_jwt_secret
            MERCURE_SUBSCRIBER_JWT_KEY: *mercure_jwt_secret
            # Keeps the subscriptions open (600s by default): a workspace reloads its tasks at
            # each reconnection. The hub still closes one when its JWT expires
            MERCURE_EXTRA_DIRECTIVES: "write_timeout 0s"
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
            interval: 5s
            timeout: 5s
            retries: 10
        profiles:
            - default
        # Its rule is longer than the one of the frontend: Traefik gives it the priority on
        # /.well-known/mercure
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-mercure.rule=Host(${PROJECT_DOMAINS}) && PathPrefix(`/.well-known/mercure`)"
            - "traefik.http.routers.${PROJECT_NAME}-mercure.tls=true"
            # The image exposes several ports (Caddy)
            - "traefik.http.services.${PROJECT_NAME}-mercure.loadbalancer.server.port=80"

    # Catches the mails sent in SMTP (port 1025) by the stack, and shows them in its web
    # interface, behind the router: same domain and port as the site, on /mailpit. The image has
    # a healthcheck (/mailpit readyz, on the webroot), that "up --wait" waits for
    mailpit:
        image: axllent/mailpit:v1.32.0
        environment:
            MP_DISABLE_VERSION_CHECK: "true"
            # Keep in sync with about() in .castor/docker.php
            MP_WEBROOT: /mailpit
        profiles:
            - default
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-mailpit.rule=Host(${PROJECT_DOMAINS}) && PathPrefix(`/mailpit`)"
            - "traefik.http.routers.${PROJECT_NAME}-mailpit.tls=true"
            # The image exposes several ports (SMTP, POP3)
            - "traefik.http.services.${PROJECT_NAME}-mailpit.loadbalancer.server.port=8025"

    frontend:
        build:
            context: services/php
            target: frontend
        user: "${USER_ID}:${USER_ID}"
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        depends_on:
            elasticsearch:
                condition: service_healthy
            mariadb:
                condition: service_healthy
            memcached:
                condition: service_started
            rabbitmq:
                condition: service_healthy
        profiles:
            - default
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-frontend.rule=Host(${PROJECT_DOMAINS})"
            - "traefik.http.routers.${PROJECT_NAME}-frontend.tls=true"
            - "traefik.http.routers.${PROJECT_NAME}-frontend-unsecure.rule=Host(${PROJECT_DOMAINS})"
            # Comment the next line to be able to access frontend via HTTP instead of HTTPS
            - "traefik.http.routers.${PROJECT_NAME}-frontend-unsecure.middlewares=redirect-to-https@file"

    worker_consumer_view:
        <<: *worker_base
        command: php bin/console messenger:consume view

    worker_consumer_webpush_notification:
        <<: *worker_base
        command: php bin/console messenger:consume webpush_notification

    builder:
        build:
            context: services/php
            target: builder
        init: true
        user: "${USER_ID}:${USER_ID}"
        environment:
            <<: *parameters_environment
            SYMFONY_ENV: "${SYMFONY_ENV:-}"
            NPM_CONFIG_UPDATE_NOTIFIER: "false"
            # The following list contains the common environment variables exposed by CI platforms
            GITHUB_ACTIONS: "${GITHUB_ACTIONS:-}"
            CI: "${CI:-}"
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        depends_on:
            - mariadb
        profiles:
            - builder

    # End-to-end tests (tests/e2e, castor qa:e2e): Playwright, its browsers and Node 24. Keep the
    # version in sync with @playwright/test in tests/e2e/package.json.
    playwright:
        image: mcr.microsoft.com/playwright:v1.64.1-noble
        init: true
        user: "${USER_ID}:${USER_ID}"
        environment:
            HOME: /home/app
            NPM_CONFIG_UPDATE_NOTIFIER: "false"
            CI: "${CI:-}"
            # The URL of the site in the browser of a developer, port included in a worktree,
            # and the router that serves it in the network of the stack (tests/e2e/playwright.config.ts)
            E2E_BASE_URL: "https://${PROJECT_ROOT_DOMAIN}${PROJECT_HTTPS_PORT:+:${PROJECT_HTTPS_PORT}}"
            E2E_ROUTER: "router:443"
        volumes:
            - "../..:/var/www:cached"
            - "../../.home:/home/app:cached"
        working_dir: /var/www/tests/e2e
        # Chromium shares its memory in /dev/shm, 64 MB by default
        shm_size: 1gb
        profiles:
            - e2e
