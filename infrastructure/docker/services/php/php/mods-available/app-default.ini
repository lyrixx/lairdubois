; priority=30
[PHP]
short_open_tag = Off
memory_limit = 512M
; PHP 8.4 and 8.5 deprecate a lot of the code of Symfony 3.4 and of its dependencies:
; without this, every command and every page is drowned in E_DEPRECATED notices.
; Symfony deprecations (E_USER_DEPRECATED) are kept.
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = On
display_startup_errors = On
error_log = /proc/self/fd/2
log_errors = On
max_execution_time = 0
; Same limits as the production server (docs/01-installation.md)
upload_max_filesize = 60M
post_max_size = 60M
[Date]
date.timezone = Europe/Paris
[Phar]
phar.readonly = Off
[opcache]
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
realpath_cache_size=4096K
realpath_cache_ttl=600
opcache.error_log = /proc/self/fd/2
