; priority=40
; memory_limit: the one of app-default.ini, the profiler of a page that fails needs it
[PHP]
expose_php = off
max_execution_time = 30
; As on the production server: an error PHP displays before the headers breaks the page (no
; session). The Routing of Symfony 4.4 makes hundreds of warnings when a request builds its cache
; (PCRE2 10.43+). They stay in the logs of the frontend; Symfony displays its own error pages.
display_errors = Off
