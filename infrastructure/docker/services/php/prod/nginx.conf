# The site in the production image "nginx" (Dockerfile), from docs/nginx/conf/www.lairdubois.fr.conf.
# In HTTP: TLS ends in front of it (the router of the stack, the reverse proxy of the host), which
# also sends /.well-known/mercure to the hub. php-fpm runs in the container of the image "php": its
# socket is in a volume shared by the two containers, like web/media (written by Liip Imagine) and
# the sitemaps (written by ladb:cron:sitemaps).

map $http_user_agent $banned_agent {
    default     0;
    "~https://developers.google.com/./web/snippet/"   1;
}

# The PDF viewer (Resources/public/ladb/pdfjs/) may not run strings as code. A map and not a
# location: the add_header of a location would drop those of the server, and an empty value sends
# no header. Keep in sync with docs/nginx/conf/ and ../nginx/conf.d/default.conf.
map $uri $pdf_viewer_csp {
    default                                         "";
    /bundles/ladbcore/ladb/pdfjs/web/viewer.html    "script-src 'self'";
}

server {
    listen 8080;
    server_name _;
    root /var/www/web;

    client_max_body_size 60M;
    add_header Vary "X-Requested-With";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-UA-Compatible "IE=edge";
    add_header Service-Worker-Allowed "/";
    add_header Content-Security-Policy $pdf_viewer_csp;
    server_tokens off;
    # Behind the proxy: no "Location: http://...:8080/"
    absolute_redirect off;

    # The ones of the nginx.conf of the production server (docs/01-installation.md)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # The address of the client (registrations, accesses of OpenCutList), given by the proxy in
    # front of the container, on a private network: REMOTE_ADDR of PHP
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    if ($banned_agent) {
        return 444;
    }

    # strip app.php/ prefix if it is present
    rewrite ^/app\.php/?(.*)$ /$1 permanent;

    location / {
        index app.php;
        try_files $uri @rewriteapp;
    }

    # Written by ladb:cron:sitemaps in the volume of SITEMAPS_DIR
    location ~ ^/sitemap-[a-z-]+\.xml$ {
        root /var/www/sitemaps;
    }

    # Unresolved Media location
    location ~ ^/media/cache/resolve/ {
        rewrite ^(.*)$ /app.php/$1 last;
    }

    # Deprecated 800x700i Media location
    location ~ ^/media/cache/800x700i/ {
        rewrite ^/media/cache/800x700i/(.*)$ /app.php/media/cache/resolve/1024x1024i/$1 permanent;
    }

    # Deprecated sticker.png location
    location ~ /sticker.png {
        rewrite ^(.*)/sticker.png$ /app.php/$1/sticker permanent;
    }

    # Resolved Media location
    location ~ ^/media/cache/ {
        if (-f $request_filename) {
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }
        try_files $uri @rewriteimagine;
    }

    location @rewriteimagine {
        rewrite ^/media/cache/(.*)$ /app.php/media/cache/resolve/$1 permanent;
    }

    location @rewriteapp {
        rewrite ^(.*)$ /app.php/$1 last;
    }

    # The ping of php-fpm, for the HEALTHCHECK of the image
    location = /ping {
        access_log off;
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_NAME /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
    }

    location ~ ^/app\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # With the port of the Host header: the one of a worktree (.castor/worktree.php) stays in
        # the absolute URLs and the redirections
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_SCHEME https;
        fastcgi_read_timeout 300;
        # Prevents URIs that include the front controller. This will 404:
        # http://domain.tld/app.php/some-path
        internal;
    }

    # The other front controllers are not in the image
    location ~ \.php$ {
        return 404;
    }

    # Media: images, icons
    location ~* \.(?:jpg|jpeg|png|ico|cur|svg|svgz)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # CSS and Javascript
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Fonts
    location ~* \.(?:eot|ttf|woff)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
