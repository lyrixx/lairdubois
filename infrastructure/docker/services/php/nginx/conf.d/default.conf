# Dev site, adapted from docs/nginx/conf/dev.lairdubois.fr.conf. PHP requests are
# forwarded to php-fpm through the unix socket.

server {
    listen 8080;
    server_name _;
    root /var/www/web;

    client_max_body_size 60M;
    add_header Vary "X-Requested-With";
    # Behind the router: no "Location: http://...:8080/"
    absolute_redirect off;

    # strip app_dev.php/ prefix if it is present
    rewrite ^/app_dev\.php/?(.*)$ /$1 permanent;

    location / {
        try_files $uri @rewriteapp;
    }

    location @rewriteapp {
        rewrite ^(.*)$ /app_dev.php/$1 last;
    }

    location ~ ^/(app_dev|config)\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # Debian's fastcgi_params sends "$host", without the port: the port of the
        # router of a worktree (see .castor/worktree.php) must stay in the absolute
        # URLs and the redirections. The router only lets lairdubois.test through.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # TLS is terminated upstream, by the router
        fastcgi_param HTTPS on;
        # web/app_dev.php only answers local requests that do not come through a
        # proxy: the router is one, the request is handed to it as a local one
        fastcgi_param REMOTE_ADDR 127.0.0.1;
        fastcgi_param HTTP_X_FORWARDED_FOR "" if_not_empty;
        fastcgi_param HTTP_CLIENT_IP "" if_not_empty;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
