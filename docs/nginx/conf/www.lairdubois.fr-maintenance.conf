server {
    listen                      443 ssl;
    listen                      [::]:443 ssl;
    http2                       on;
    server_name                 www.lairdubois.fr;
    root                        /var/www/www.lairdubois.fr/web;
    client_max_body_size        8M;

    ssl_certificate             /etc/letsencrypt/live/lairdubois.fr/fullchain.pem;
    ssl_certificate_key         /etc/letsencrypt/live/lairdubois.fr/privkey.pem;

    ssl_session_cache           shared:SSL:20m;
    ssl_session_timeout         180m;

    ssl_prefer_server_ciphers   on;
    ssl_ciphers                 ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DHE+AES128:!ADH:!AECDH:!MD5;

    # The files of web/ as they are (the page and what it loads), any other URL in 503 with the
    # page: the robots keep the pages of the site and come back after Retry-After (seconds). Each
    # location has its try_files: a regex location comes before "/"
    add_header                  Retry-After 3600 always;
    error_page                  503 /maintenance.html;

    location / {
        try_files $uri =503;
    }

    # Html
    location ~* \.(?:html)$ {
      try_files $uri =503;
      expires -1;
    }

    # Media: images, icons
    location ~* \.(?:jpg|jpeg|png|ico|cur|svg|svgz)$ {
      try_files $uri =503;
      expires 1y;
      access_log off;
      add_header Cache-Control "public";
    }

    # CSS and Javascript
    location ~* \.(?:css|js)$ {
      try_files $uri =503;
      expires 1y;
      access_log off;
      add_header Cache-Control "public";
    }

    error_log /var/log/nginx/www.lairdubois.fr_error.log;
    access_log /var/log/nginx/www.lairdubois.fr_access.log;
}

server {
    listen          80;
    listen          [::]:80;
    server_name     lairdubois.fr
                    *.lairdubois.fr
                    lairdubois.com
                    *.lairdubois.com
                    lairdubois.org
                    *.lairdubois.org;

    location / {
        return          301 https://www.lairdubois.fr$request_uri;
    }
}

